services:
  upload-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      DEMO_ACCOUNT: demo@nus.edu.sg
      DEMO_PASSWORD: demo1234
      DEMO_TOKEN: replace-this-token-before-deployment
      ENABLE_DEMO_LOGIN: "true"
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-long-random-secret}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
